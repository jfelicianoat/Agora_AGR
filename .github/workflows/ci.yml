name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      # Los tests cubren tablero (api), runner, OAuth y escritorio: necesitan sus extras
      - run: python -m pip install -e ".[dev,api,runner,oauth,desktop]"
      - name: Lint
        if: ${{ !cancelled() }}
        run: python -m ruff check .
      - name: Tests
        if: ${{ !cancelled() }}
        run: python -m pytest -q
